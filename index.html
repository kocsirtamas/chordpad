<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#171512">
<title>Chordpad</title>
<style>
  :root{
    --bg:#171512; --panel:#211e19; --panel-2:#2a2620;
    --line:rgba(255,255,255,.07);
    --key:#e8dcc8; --key-2:#cdc0a6; --key-edge:#8e8571;
    --amber:#d98b3f; --amber-glow:#f2a559;
    --ink:#ece4d6; --dim:#9c9184; --faint:#6c6558;
    --green:#7ea86c;
    --gray-fn:#b9bec6; --yellow-fn:#e8c24a; --red-fn:#e06050;

    --gap: clamp(5px, 1.4vmin, 12px);
    --pad: clamp(10px, 2.4vmin, 22px);
    --radius: clamp(10px, 1.6vmin, 16px);
    --t-xs: clamp(11px, 2.7vmin, 15px);
    --t-sm: clamp(13px, 3.3vmin, 18px);
    --t-md: clamp(15px, 4vmin,   22px);
    --t-lg: clamp(21px, 5.4vmin, 34px);
    --t-xl: clamp(34px, 9vmin,   72px);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:ui-monospace,SFMono-Regular,Menlo,"Courier New",monospace;
    -webkit-tap-highlight-color:transparent; user-select:none;
  }

  .app{
    height:100dvh; width:100%;
    margin:0 auto; padding:var(--pad);
    display:grid; gap:var(--gap);
    grid-template-columns:1fr;
    grid-template-rows:auto auto minmax(0,0.85fr) minmax(0,1.7fr) auto;
    grid-template-areas:"head" "tabs" "mod" "pad" "readout";
  }

  .head{grid-area:head;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .readout{grid-area:readout;}
  .modwrap{grid-area:mod;}
  .pad{grid-area:pad;}
  .tabs{grid-area:tabs;}

  /* ---------- header ---------- */
  .wordmark{font-size:var(--t-sm);letter-spacing:3px;color:var(--dim);}
  .chips{display:flex;gap:5px;flex-wrap:wrap;flex:1 1 auto;min-width:0;}
  .chip{
    font-size:var(--t-xs);padding:.45em .8em;border-radius:999px;
    background:var(--panel);border:1px solid var(--line);color:var(--dim);white-space:nowrap;
  }
  .chip b{color:var(--ink);font-weight:600;}
  .chip.tappable{cursor:pointer;border-color:rgba(255,255,255,.14);}
  .chip.tappable:active{border-color:rgba(242,165,89,.6);}
  .chip.on{border-color:rgba(242,165,89,.55);color:var(--amber-glow);}
  .chip.on b{color:var(--amber-glow);}

  /* ---------- readout ---------- */
  /* Fixed height on purpose: the chord name changing must never resize this
     box and shove the pad down the screen. */
  .readout{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:0 clamp(8px,1.8vmin,16px);
    height:calc(var(--t-lg) * 1.5);
    display:flex;align-items:center;gap:.8em;overflow:hidden;
  }
  .chordname{
    font-size:var(--t-lg);line-height:1;font-weight:700;white-space:nowrap;
    color:var(--amber-glow);
  }
  .chordname .also{color:var(--ink);opacity:.35;font-size:.5em;margin-left:.35em;}
  .chordname.idle{color:var(--faint);letter-spacing:2px;}
  .notes{font-size:var(--t-sm);color:var(--dim);letter-spacing:2px;white-space:nowrap;overflow:hidden;}
  .tags{display:flex;gap:4px;flex-wrap:wrap;}
  .tag{
    font-size:var(--t-xs);padding:.25em .6em;border-radius:4px;
    background:rgba(126,168,108,.13);color:var(--green);border:1px solid rgba(126,168,108,.28);
    white-space:nowrap;
  }
  .tag.off{background:transparent;color:var(--faint);border-color:var(--line);}

  /* ---------- modifiers + side controls ---------- */
  .modwrap{display:flex;gap:var(--gap);min-height:clamp(120px,18vh,260px);min-width:0;}
  .modpad{
    flex:1 1 55%;min-width:0;min-height:0;
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);
    gap:4px;padding:5px;
  }
  .mod{
    border-radius:calc(var(--radius) * .6);background:var(--panel-2);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;text-align:center;
    font-size:var(--t-xs);color:var(--dim);padding:2px;line-height:1.15;min-width:0;overflow:hidden;
  }
  .mod.centre{background:transparent;border-style:dashed;color:var(--faint);flex-direction:column;line-height:1.1;}
  .mod.centre b{display:block;color:var(--ink);font-size:1.05em;letter-spacing:.02em;}
  .mod.centre .sub{display:block;font-size:.85em;opacity:.65;}
  .mod.latched{background:rgba(217,139,63,.16);border-color:rgba(242,165,89,.5);color:var(--amber-glow);}
  .mod.momentary{background:rgba(126,168,108,.14);border-color:rgba(126,168,108,.45);color:var(--green);}

  .sidecol{flex:1 1 45%;display:flex;flex-direction:column;gap:var(--gap);min-width:0;min-height:0;}
  .cell{
    flex:1;border-radius:var(--radius);background:var(--panel);border:1px solid var(--line);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.35em;
    font-size:var(--t-xs);color:var(--dim);padding:clamp(5px,1.2vmin,12px);min-height:0;
  }
  .cell .val{color:var(--ink);font-size:var(--t-md);}
  .cell.on{border-color:rgba(242,165,89,.55);color:var(--amber-glow);}
  .cell.on .val{color:var(--amber-glow);}
  .cell.action{border-color:rgba(255,255,255,.16);}
  .cell.action .val{font-size:var(--t-sm);}
  .looplabel{display:flex;align-items:center;gap:.5em;}
  .reclamp{
    width:.7em;height:.7em;border-radius:50%;
    background:#5b4a3a;border:1px solid rgba(255,255,255,.12);
  }
  .cell.on .reclamp{background:var(--red-fn);box-shadow:0 0 8px rgba(224,96,80,.7);}
  .cell.wide{align-items:stretch;}
  .cell .lbl{display:flex;justify-content:space-between;width:100%;}
  .lbl b{color:var(--ink);font-weight:600;}
  .dotrow{display:flex;gap:4px;}
  .dot{width:.5em;height:.5em;border-radius:50%;background:var(--faint);}
  .dot.on{background:var(--amber);}

  input[type=range]{
    -webkit-appearance:auto;appearance:auto;
    width:100%;height:1.6em;margin:0;
    accent-color:var(--amber);
  }

  /* ---------- chord pad: 3 over 4 ---------- */
  .pad{display:flex;flex-direction:column;gap:var(--gap);min-height:0;}
  .padrow{display:flex;gap:var(--gap);min-height:0;}
  .row-top{flex:1 1 0;min-height:clamp(46px,7.5vh,120px);}
  .row-bottom{flex:1.75 1 0;min-height:clamp(80px,13vh,210px);}
  .k{
    flex:1;border-radius:calc(var(--radius) * .85);min-width:0;
    background:linear-gradient(180deg,var(--key),var(--key-2));
    border:1px solid #f4eee1;
    box-shadow:0 3px 0 var(--key-edge), 0 6px 14px rgba(0,0,0,.45);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.15em;
    color:#2b2f36;
  }
  .k .deg{font-size:var(--t-lg);font-weight:700;line-height:1;}
  .k .rn{font-size:var(--t-xs);color:#6d7480;}
  .k .nm{font-size:var(--t-sm);color:#4a4f58;}
  .k.locked{box-shadow:0 3px 0 var(--key-edge), 0 6px 14px rgba(0,0,0,.45), inset 0 0 0 2px rgba(126,168,108,.55);}
  .k.held{
    background:linear-gradient(180deg,#f7efdd,#e0d5bc);
    box-shadow:0 1px 0 var(--key-edge), 0 3px 8px rgba(0,0,0,.5), inset 0 0 0 2px rgba(242,165,89,.55);
    transform:translateY(2px);
  }

  /* ---------- tabs ---------- */
  .tabs{display:flex;gap:var(--gap);}
  .tab{
    flex:1;border-radius:calc(var(--radius) * .85);background:var(--panel);border:1px solid var(--line);
    padding:clamp(6px,1.3vmin,14px) 4px;
    display:flex;flex-direction:column;align-items:center;gap:.35em;
    font-size:var(--t-xs);color:var(--dim);min-width:0;
  }
  .tab .swatch{width:1.8em;height:.35em;border-radius:3px;}
  .tab .sub{color:var(--faint);text-align:center;}
  .tab.gray .swatch{background:var(--gray-fn);}
  .tab.yellow .swatch{background:var(--yellow-fn);}
  .tab.red .swatch{background:var(--red-fn);}
  .tab.blue .swatch{background:#5a8fb8;}

  /* ---------- tall screens: cap the column so it does not sprawl ---------- */
  @media (min-aspect-ratio:3/5){
    .app{max-width:min(96vw, 150vh);}
  }

  /* ---------- landscape / wide: two columns ---------- */
  @media (min-aspect-ratio:1/1){
    .app{
      max-width:100vw;
      grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);
      grid-template-rows:auto minmax(0,auto) minmax(0,1fr) auto;
      grid-template-areas:
        "head    head"
        "tabs    pad"
        "mod     pad"
        "readout pad";
    }
    .readout{flex-direction:row;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.6em;}
    .readout .tags{justify-content:flex-end;max-width:60%;}
    .modwrap{flex-direction:row;min-height:0;}
    .row-top,.row-bottom{min-height:0;}
  }

  /* A phone in landscape is about 2.2:1, and capping the width there left a
     band of unused screen down one side. Fill it. */
  @media (min-aspect-ratio:16/10){
    .app{max-width:100vw;}
    .tab .sub{display:block;}
  }

  /* Playing a key must never scroll the page. Set here and nowhere higher, so
     dragging anywhere else still pulls to refresh. */
  /* Playing surfaces must not be read as scroll gestures, or the browser
     cancels the pointer mid drag. Left off the header, readout and tabs, so
     pull to refresh still works there. */
  .pad,.padrow,.k,.modpad,.mod{touch-action:none;}
  /* Panels must still scroll, so these allow a vertical drag and only swallow
     the gestures that would otherwise steal a tap. */
  .cell,.tab,.opt,.drawer,.readout{touch-action:pan-y;}

  /* ---------- panels ---------- */
  .drawer:empty{display:none;}
  .drawer{
    grid-area:mod;z-index:10;overflow:auto;min-height:0;
    background:var(--panel);border:1px solid rgba(242,165,89,.35);
    border-radius:var(--radius);padding:var(--gap);
  }
  .app.panelopen .modwrap{display:none;}
  .panelbody{display:flex;flex-wrap:wrap;gap:var(--gap);}
  .opt{
    font:inherit;font-size:var(--t-sm);color:var(--dim);cursor:pointer;
    background:var(--panel-2);border:1px solid var(--line);
    border-radius:calc(var(--radius) * .6);padding:.55em .9em;min-height:2.4em;
  }
  .opt.on{background:rgba(217,139,63,.16);border-color:rgba(242,165,89,.5);color:var(--amber-glow);}
  .opt.off{opacity:.45;text-decoration:line-through;}
  /* A switch for something that does not exist yet: shown, so its place is
     learned, but not something to decide about. */
  .opt.idle{opacity:.3;cursor:default;}
  /* Small, since it sits inside a label and is only wanted occasionally. */
  .reset{font:inherit;font-size:var(--t-xs);color:var(--faint);background:none;
    border:1px solid currentColor;border-radius:4px;padding:0 .35em;margin-left:.4em;
    cursor:pointer;line-height:1.4;}
  .reset:hover{color:var(--ink);}
  /* Something is waiting for the downbeat. */
  @keyframes waitingpulse{0%,100%{opacity:1;}50%{opacity:.45;}}
  .chip.waiting{animation:waitingpulse 1s ease-in-out infinite;}

  /* ---------- where the transport has got to ---------- */
  .transport{display:flex;justify-content:center;}
  .steps{display:flex;flex-direction:column;gap:3px;width:100%;opacity:.4;transition:opacity .2s;
    background:none;border:0;padding:4px 0;font:inherit;color:inherit;cursor:pointer;}
  .steps.running{opacity:1;}
  .steprow{display:flex;gap:2px;}
  .lamp{flex:1 1 0;min-width:0;height:7px;border-radius:2px;background:var(--faint);
    opacity:.22;transition:opacity .06s,background .06s;}
  .lamp.onbeat{opacity:.4;}
  .lamp.past{opacity:.55;}
  .lamp.now{background:var(--ink);opacity:1;}
  .barrow{display:flex;gap:3px;justify-content:center;}
  .barlamp{width:14px;height:4px;border-radius:2px;background:var(--faint);opacity:.22;
    transition:opacity .08s,background .08s;}
  .barlamp.past{opacity:.45;}
  .barlamp.now{background:var(--accent,#e8b33a);opacity:1;}
  .opt.loading{opacity:.6;border-style:dashed;}
  .optrow{display:flex;gap:var(--gap);flex-wrap:wrap;width:100%;}
  .seqsteps,.statusbox{
    width:100%;font-size:var(--t-sm);color:var(--ink);letter-spacing:3px;
    background:var(--panel-2);border:1px solid var(--line);
    border-radius:calc(var(--radius) * .6);padding:.6em .8em;
  }
  .seqsteps.empty,.statusbox{letter-spacing:1px;}
  .seqsteps.empty,.statusbox.empty{color:var(--faint);}
  .group{width:100%;display:flex;flex-direction:column;gap:calc(var(--gap) * .6);}
  .grouplabel{font-size:var(--t-xs);color:var(--dim);letter-spacing:2px;}
  .filepicker{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;}
  .buildstamp{margin-left:auto;font-size:var(--t-xs);color:var(--faint);white-space:nowrap;}
  .tab.on{border-color:rgba(242,165,89,.5);}
  .gate{
    position:fixed;inset:0;z-index:50;background:var(--bg);
    display:flex;align-items:center;justify-content:center;
  }
  .gatetext{
    font-size:var(--t-lg);letter-spacing:4px;color:var(--amber-glow);
    border:1px solid rgba(242,165,89,.4);border-radius:var(--radius);
    padding:1em 1.6em;
  }
  .debugbox{
    position:fixed;top:0;left:0;right:0;z-index:99;
    background:rgba(0,0,0,.86);color:#7ea86c;
    font:11px/1.35 ui-monospace,monospace;padding:6px 8px;
    white-space:pre;overflow:auto;max-height:45dvh;
  }
</style>
</head>
<body>
<div class="app" id="app"></div>
<script type="module" src="src/main.js"></script>
</body>
</html>
